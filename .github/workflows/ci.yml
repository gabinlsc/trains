name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 22
  # Les hooks Git n'ont aucun intérêt en CI.
  CI: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage
      - name: Rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: packages/*/coverage/
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Image officielle de Playwright : Chromium et ses dépendances système y sont
    # déjà installés, le job ne dépend plus des miroirs apt d'Ubuntu. Sa version
    # suit celle de @playwright/test dans apps/web/package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @trains/web build
      - run: pnpm --filter @trains/web e2e
      - name: Rapport en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright
          path: apps/web/test-results/
          retention-days: 7

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: ShellCheck de tous les scripts versionnés
        run: |
          shellcheck --version
          mapfile -t scripts < <(git ls-files '*.sh')
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "Aucun script shell."
            exit 0
          fi
          shellcheck --severity=style "${scripts[@]}"

  deploy-test:
    name: deploy-test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Inutile de monter un conteneur systemd si seule la doc a changé.
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'docs/')
    steps:
      - uses: actions/checkout@v5
        with:
          # Le test pousse HEAD dans un dépôt nu : l'historique doit être complet.
          fetch-depth: 0
      - name: Déploiement dans Ubuntu 24.04 (installation, idempotence, mise à jour, rollback)
        run: bash deploy/test/run.sh

  check-clean:
    name: check-clean
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          # Historique complet : le garde-fou compare la branche à main.
          fetch-depth: 0
      - name: Garde-fou
        env:
          CHECK_CLEAN_BASE: origin/${{ github.base_ref || 'main' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Sur une PR, HEAD est le commit de fusion ; on contrôle donc les
          # commits de la branche source elle-même.
          if [ -n "$HEAD_SHA" ]; then
            git checkout --quiet "$HEAD_SHA"
          fi
          bash scripts/check-clean.sh
